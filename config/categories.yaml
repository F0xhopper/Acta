# Category definitions. `keywords` are matched against the query's category words.
# pays_for_marketing: verticals that routinely spend on leads and will pay for a site.
# walk_in: prefer a walk-in pitch. dm: Instagram/Facebook DM is a good secondary channel.
# must_haves: what the new site needs, used in the pitch pack notes.
categories:
  - key: plumber
    keywords: [plumber, plumbers, plumbing, heating engineer, gas engineer, boiler]
    pays_for_marketing: true
    sic: ["43220"]
    must_haves: [emergency call-out banner, Gas Safe number if applicable, service areas, boiler and bathroom service pages]
  - key: electrician
    keywords: [electrician, electricians, electrical]
    pays_for_marketing: true
    sic: ["43210"]
    must_haves: [NICEIC or NAPIT badge if applicable, EICR and rewire service pages, emergency call-out, service areas]
  - key: roofer
    keywords: [roofer, roofers, roofing]
    pays_for_marketing: true
    sic: ["43910"]
    must_haves: [emergency repairs, flat and pitched roof pages, before and after gallery, service areas]
  - key: builder
    keywords: [builder, builders, building contractor, extensions, loft conversion]
    pays_for_marketing: true
    sic: ["41202", "43390"]
    must_haves: [project gallery, extensions and conversions pages, quote form, accreditations]
  - key: landscaper
    keywords: [landscaper, landscapers, landscaping, landscape gardener, gardener, gardening, fencing, paving]
