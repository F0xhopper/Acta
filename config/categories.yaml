# Category definitions. `keywords` are matched against the query's category words.
# pays_for_marketing: verticals that routinely spend on leads and will pay for a site.
# trade_value: 0-100, how much a website is worth to this trade: what one job is worth, whether customers find them
# on Google (not an app or Instagram), and whether they already have sites. Gates and grades leads (config/pick.yaml).
# walk_in: prefer a walk-in pitch. dm: Instagram/Facebook DM is a good secondary channel.
# must_haves: what the new site needs, used in the pitch pack notes.
# query: what the automatic sweep searches for. areas: the area group in config/areas.yaml it is searched across
# (default: high_streets for walk_in, trades for everything else).
categories:
  - key: plumber
    trade_value: 85
    query: plumbers
    search_terms: [heating engineer, boiler repair, gas engineer]
    keywords: [plumber, plumbers, plumbing, heating engineer, gas engineer, boiler]
    pays_for_marketing: true
    sic: ["43220"]
    must_haves: [emergency call-out banner, Gas Safe number if applicable, service areas, boiler and bathroom service pages]
