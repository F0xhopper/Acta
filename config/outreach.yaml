# How pitches and follow-ups are sent. Everything here starts in the safest setting: you send by hand.
#
# transport:
#   manual  You copy the email into your mail app and press "Mark as sent". Acta records it and reminds you to follow up.
#   test    Acta "sends" by writing each email to out/outbox/ as a .eml file. Use it to try the whole flow safely.
#   proton  Acta sends through Proton Mail Bridge running on this Mac (needs PROTON_BRIDGE_USER and PROTON_BRIDGE_PASSWORD in .env).
#   resend  Acta sends through the Resend API (needs RESEND_API_KEY in .env).
transport: manual

# The address pitches come from. Blank means the sender email in config/offer.yaml.
from: ""

# Warm-up: a new sending domain must start slowly. The daily limit starts low and rises each week.
# It is enforced for every email Acta sends itself; with manual sending it's shown as a guide.
cap:
  start_per_day: 3
  increase_per_week: 3
  max_per_day: 20

# Follow-ups after the first pitch, in days after it, and the most contacts per business (pitch included).
follow_ups:
  days: [3, 8]
  max_contacts: 3
  # true: Acta sends due email follow-ups itself, inside the send window, within the daily limit
  # (needs transport proton or resend). false: they appear in the Inbox for you to send.
  auto: false

# When Acta may send on its own (automatic follow-ups). Days are 1 = Monday to 7 = Sunday, times are local.
send_window:
  days: [1, 2, 3, 4, 5]
  from: "09:00"
  to: "17:00"

# Reply detection: read the inbox through Proton Mail Bridge, move businesses that answer to Replied
# (which stops their follow-ups), and add anyone who asks you to stop to the do-not-contact list.
replies:
  check: false
  every_minutes: 10

# Proton Mail Bridge, which runs on this Mac. These are Bridge's defaults.
proton_bridge:
  host: "127.0.0.1"
  smtp_port: 1025
  imap_port: 1143
